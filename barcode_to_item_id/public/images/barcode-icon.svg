<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Corner brackets serving as outline (expanded with rounded outer edges) -->
  <!-- Top left -->
  <path d="M0 18 L0 4 Q0 0 4 0 L18 0" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <!-- Top right -->
  <path d="M60 18 L60 4 Q60 0 56 0 L42 0" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <!-- Bottom left -->
  <path d="M0 42 L0 56 Q0 60 4 60 L18 60" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <!-- Bottom right -->
  <path d="M60 42 L60 56 Q60 60 56 60 L42 60" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>

  <!-- Centered and bigger barcode lines -->
  <rect x="10" y="20" width="4" height="20" fill="#1f2937"/>
  <rect x="15" y="20" width="2" height="20" fill="#1f2937"/>
  <rect x="18" y="20" width="4" height="20" fill="#1f2937"/>
  <rect x="23" y="20" width="2" height="20" fill="#1f2937"/>
  <rect x="26" y="20" width="4" height="20" fill="#1f2937"/>
  <rect x="31" y="20" width="2" height="20" fill="#1f2937"/>
  <rect x="34" y="20" width="4" height="20" fill="#1f2937"/>
  <rect x="39" y="20" width="2" height="20" fill="#1f2937"/>
  <rect x="42" y="20" width="4" height="20" fill="#1f2937"/>
  <rect x="47" y="20" width="4" height="20" fill="#1f2937"/>

  <!-- Centered scanning line -->
  <rect x="4" y="28" width="52" height="2" fill="#ef4444" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
